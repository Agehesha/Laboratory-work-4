name: Print Software Versions

on:
  push:
    branches:
      - main

jobs:
  PrintSoftwareVersions:
    runs-on: ubuntu-latest

    steps:
      - name: Print Node.js Version
        run: node --version

  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: [PrintSoftwareVersions]

    steps:
      - name: Print PostgreSQL Version
        run: psql --version
